[package]
name = "image-optimizer"
version = "0.2.0"
edition = "2024"
description = "Sequential, shrink-on-load image conversion with libvips"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
libvips = "2.3.0"
libc = "0.2"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
walkdir = "2"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
